<!DOCTYPE html>
<html>
<head>
    <title>Sodium Glas | Museum</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: 'Candara Light', sans-serif; color: #fff; overflow-x: hidden; }
        #overlay { position: fixed; inset: 0; z-index: 10; pointer-events: none; padding: 40px; }
        .museum-header { pointer-events: auto; }
        .museum-header h1 { font-weight: 100; letter-spacing: 15px; font-size: 3em; margin: 0; color: #cbefff; }
        
        /* The Object Tray (Image 2 style) */
        .object-tray { 
            position: fixed; bottom: 50px; left: 0; width: 100%; 
            display: flex; gap: 30px; padding: 0 50px; overflow-x: auto; 
            pointer-events: auto; box-sizing: border-box;
        }
        .obj-card { 
            min-width: 280px; height: 380px; background: rgba(255,255,255,0.05); 
            backdrop-filter: blur(20px); border-radius: 40px; border: 1px solid rgba(255,255,255,0.1);
            padding: 30px; box-sizing: border-box; display: flex; flex-direction: column;
            transition: 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .obj-card:hover { transform: translateY(-20px); border-color: #cbefff; }
        .preview-area { height: 180px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; display: flex; align-items: center; justify-content: center; }
        .info-card { font-size: 0.8em; line-height: 1.6; opacity: 0.7; }
        .info-card b { color: #cbefff; font-weight: 300; }
        
        .add-btn { cursor: pointer; border: 1px dashed #cbefff; justify-content: center; align-items: center; opacity: 0.5; }
        .add-btn:hover { opacity: 1; }

        /* Edit Modal */
        #editBox { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #000; border: 1px solid #cbefff; padding: 40px; border-radius: 30px;
            display: none; z-index: 1000; width: 400px; pointer-events: auto;
        }
        input { width: 100%; padding: 10px; margin: 10px 0; background: transparent; border: 1px solid #cbefff; color: #fff; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="overlay">
        <div class="museum-header">
            <h1 id="mNameDisplay">LOADING...</h1>
            <p id="slotIdDisplay" style="opacity: 0.4; letter-spacing: 3px;"></p>
        </div>

        <div class="object-tray" id="tray">
            </div>
    </div>

    <div id="editBox">
        <h3>CURATE ARTIFACT</h3>
        <input type="text" id="objName" placeholder="Object Name">
        <input type="text" id="objAge" placeholder="Estimated Age (e.g. 200 years)">
        <input type="text" id="objFound" placeholder="Found Location">
        <input type="text" id="objLink" placeholder="File URL (.glb, .png, .pdf)">
        <button onclick="saveObject()" style="background:#cbefff; border:none; padding:15px; width:100%; border-radius:10px; font-weight:bold; cursor:pointer;">ADD TO COLLECTION</button>
        <button onclick="this.parentElement.style.display='none'" style="background:transparent; color:#fff; border:none; margin-top:10px; width:100%; cursor:pointer;">CANCEL</button>
    </div>

    <a-scene embedded style="height: 100vh; width: 100vw;">
        <a-sky color="#000"></a-sky>
        <a-entity id="museum-stage" position="0 0 -5"></a-entity>
        <a-camera position="0 1.6 0"></a-camera>
        <a-light type="ambient" intensity="0.3"></a-light>
        <a-light type="point" position="2 4 -3" intensity="1.5" color="#cbefff"></a-light>
    </a-scene>

    <script src="spine.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const slot = params.get('slot');
        const isAdmin = params.get('edit') === 'true';
        let museumData = Concordia.getMuseum(slot);

        function render() {
            document.getElementById('mNameDisplay').innerText = museumData.name.toUpperCase();
            document.getElementById('slotIdDisplay').innerText = "SYSTEM SLOT: " + slot;
            const tray = document.getElementById('tray');
            tray.innerHTML = "";

            museumData.objects.forEach(obj => {
                const card = document.createElement('div');
                card.className = "obj-card";
                card.innerHTML = `
                    <div class="preview-area"><p style="font-size:3em">◈</p></div>
                    <div class="info-card">
                        <p><b>NAME:</b> ${obj.name}</p>
                        <p><b>AGE:</b> ${obj.age}</p>
                        <p><b>ORIGIN:</b> ${obj.found}</p>
                        <p style="font-size:0.7em; opacity:0.5; margin-top:10px">${obj.type.toUpperCase()}</p>
                    </div>
                `;
                tray.appendChild(card);
            });

            if(isAdmin && museumData.objects.length < 7) {
                const add = document.createElement('div');
                add.className = "obj-card add-btn";
                add.innerHTML = "<h1>+</h1><p>ADD NEW</p>";
                add.onclick = () => document.getElementById('editBox').style.display = 'block';
                tray.appendChild(add);
            }
        }

        function saveObject() {
            const newObj = {
                name: document.getElementById('objName').value,
                age: document.getElementById('objAge').value,
                found: document.getElementById('objFound').value,
                url: document.getElementById('objLink').value,
                type: document.getElementById('objLink').value.split('.').pop()
            };
            museumData.objects.push(newObj);
            Concordia.sync(slot, museumData);
            document.getElementById('editBox').style.display = 'none';
            render();
        }

        render();
    </script>
</body>
</html>
