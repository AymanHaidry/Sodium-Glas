<!DOCTYPE html>
<html>
<head>
    <title>Sodium Glas | Vault</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #000; --neon: #cbefff; }
        body { 
            margin: 0; font-family: 'Candara Light', sans-serif; color: #fff; 
            background: radial-gradient(circle at top, #00043e, #000); min-height: 100vh;
        }
        .system-bar {
            position: fixed; top: 0; left: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); z-index: 1000; box-sizing: border-box;
        }
        .object-tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; padding: 120px 50px 50px; }
        .obj-card { 
            background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border-radius: 30px; 
            border: 1px solid rgba(203,239,255,0.1); padding: 25px; position: relative;
        }
        .preview-box { height: 180px; border-radius: 20px; background: #000; margin-bottom: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .info b { color: var(--neon); font-size: 0.8em; letter-spacing: 1px; }
        .info p { margin: 8px 0; font-size: 0.9em; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-group button { padding: 10px; border-radius: 10px; cursor: pointer; font-family: 'Candara Light'; font-weight: bold; border: none;}
        .del-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,0,0,0.2); color: #ff4444; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; border: none;}
        
        #editBox { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #06162e; border: 1px solid var(--neon); padding: 40px; border-radius: 30px; display: none; z-index: 2000; width: 380px;
        }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(203,239,255,0.2); color: #fff; border-radius: 10px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="system-bar">
        <h2 style="font-weight:100; letter-spacing:5px; margin:0;">VAULT <span id="slotLabel"></span></h2>
        <button class="logout-btn" onclick="location.href='index.html'" style="background:transparent; color:#cbefff; border:1px solid #cbefff; padding:5px 15px; border-radius:20px; cursor:pointer">BACK</button>
    </div>

    <div class="object-tray" id="tray"></div>

    <div id="editBox">
        <h2 style="font-weight:100; color:var(--neon); margin-top:0;">CURATE</h2>
        <input type="text" id="objName" placeholder="Artifact Name">
        <input type="text" id="objAge" placeholder="Estimated Age (e.g. 2000 BC)">
        <input type="text" id="objFound" placeholder="Found Location">
        <textarea id="objDesc" placeholder="Description..." rows="3"></textarea>
        <input type="file" id="fileInp">
        <button onclick="saveObject()" style="background:var(--neon); width:100%; padding:15px; border-radius:12px; font-weight:bold; cursor:pointer; margin-top:10px;">STORE IN VAULT</button>
        <button onclick="document.getElementById('editBox').style.display='none'" style="background:transparent; color:#fff; border:none; width:100%; margin-top:10px; cursor:pointer;">CANCEL</button>
    </div>

    <script>
        const _supabase = supabase.createClient('https://umyynnesolilokzetade.supabase.co', 'sb_publishable_7Ry0VfCXyP_gumhjyLTdQg_6UKuCLSy');
        const params = new URLSearchParams(window.location.search);
        const slot = params.get('slot');
        const isAdmin = params.get('edit') === 'true';
        let museumData = { objects: [] };

        async function loadMuseum() {
            const { data } = await _supabase.from('museums').select('*').eq('slot_id', slot).single();
            if (data) { museumData = data; render(); }
            else if (isAdmin) render(); 
        }

        function render() {
            const tray = document.getElementById('tray');
            tray.innerHTML = "";
            museumData.objects.forEach((obj, i) => {
                const card = document.createElement('div');
                card.className = "obj-card";
                card.innerHTML = `
                    ${isAdmin ? `<button class="del-btn" onclick="deleteObj(${i})">×</button>` : ''}
                    <div class="preview-box"><img src="${obj.url}"></div>
                    <div class="info">
                        <p><b>NAME:</b> ${obj.name}</p>
                        <p><b>AGE:</b> ${obj.age}</p>
                        <p><b>ORIGIN:</b> ${obj.found}</p>
                        <p style="font-size:0.7em; opacity:0.6">${obj.desc}</p>
                    </div>
                    <div class="btn-group">
                        <button style="background:#cbefff" onclick="window.open('${obj.url}')">VIEW</button>
                        <button style="border:1px solid #cbefff; color:#cbefff; background:transparent" onclick="download('${obj.url}', '${obj.name}')">DL</button>
                    </div>
                `;
                tray.appendChild(card);
            });
            if(isAdmin) {
                const add = document.createElement('div');
                add.className = "obj-card"; add.style.display="flex"; add.style.alignItems="center"; add.style.justifyContent="center"; add.style.border="1px dashed #cbefff"; add.style.cursor="pointer";
                add.innerHTML = "<h2>+ ADD</h2>";
                add.onclick = () => document.getElementById('editBox').style.display = 'block';
                tray.appendChild(add);
            }
        }

        async function saveObject() {
            const file = document.getElementById('fileInp').files[0];
            const fileName = `${Date.now()}_${file.name}`;
            await _supabase.storage.from('vault-assets').upload(fileName, file);
            const { data: { publicUrl } } = _supabase.storage.from('vault-assets').getPublicUrl(fileName);

            const newObj = {
                name: document.getElementById('objName').value,
                age: document.getElementById('objAge').value,
                found: document.getElementById('objFound').value,
                desc: document.getElementById('objDesc').value,
                url: publicUrl
            };

            museumData.objects.push(newObj);
            await _supabase.from('museums').upsert({ slot_id: slot, objects: museumData.objects, owner_uid: localStorage.getItem('sodium_uid') });
            location.reload();
        }

        async function deleteObj(i) {
            museumData.objects.splice(i, 1);
            await _supabase.from('museums').update({ objects: museumData.objects }).eq('slot_id', slot);
            render();
        }

        loadMuseum();
    </script>
</body>
</html>
