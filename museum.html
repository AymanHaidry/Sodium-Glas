<!DOCTYPE html>
<html>
<head>
    <title>Sodium Glas | Museum</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        :root { --bg: #000000; --neon: #cbefff; }
        body { 
            margin: 0; font-family: 'Candara Light', sans-serif; color: #fff; overflow: hidden;
            background: radial-gradient(circle at top, #00043e, var(--bg));
        }
        
        .logout-btn { 
            position: fixed; top: 30px; right: 30px; z-index: 100;
            background: rgba(203, 239, 255, 0.05); border: 1px solid var(--neon); color: var(--neon);
            padding: 8px 25px; border-radius: 20px; cursor: pointer; font-family: 'Candara Light';
            backdrop-filter: blur(10px); transition: 0.3s; letter-spacing: 2px;
        }
        .logout-btn:hover { background: var(--neon); color: #000; }

        #overlay { position: fixed; inset: 0; z-index: 10; pointer-events: none; padding: 40px; }
        .museum-header { pointer-events: auto; }
        .museum-header h1 { font-weight: 100; letter-spacing: 15px; font-size: 3em; margin: 0; color: #cbefff; }
        
        .object-tray { 
            position: fixed; bottom: 50px; left: 0; width: 100%; 
            display: flex; gap: 30px; padding: 0 50px; overflow-x: auto; 
            pointer-events: auto; box-sizing: border-box;
        }
        .obj-card { 
            min-width: 280px; height: 380px; background: rgba(255,255,255,0.05); 
            backdrop-filter: blur(20px); border-radius: 40px; border: 1px solid rgba(255,255,255,0.1);
            padding: 25px; box-sizing: border-box; display: flex; flex-direction: column; transition: 0.3s;
        }
        .obj-card:hover { border-color: var(--neon); background: rgba(255,255,255,0.1); }

        .preview-area { height: 160px; border-radius: 25px; overflow: hidden; margin-bottom: 15px; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(203, 239, 255, 0.1); }
        .preview-img { width: 100%; height: 100%; object-fit: cover; }
        
        .info-card b { color: var(--neon); font-weight: 300; font-size: 0.9em; }
        .info-card p { margin: 5px 0; font-size: 0.8em; opacity: 0.8; }

        .dl-btn { 
            margin-top: auto; background: var(--neon); color: #000; border: none; 
            padding: 12px; border-radius: 15px; font-weight: bold; cursor: pointer; font-family: 'Candara Light';
        }

        #editBox { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); border: 1px solid var(--neon); 
            padding: 40px; border-radius: 30px; display: none; z-index: 1000; width: 350px; pointer-events: auto;
            backdrop-filter: blur(20px);
        }
        input { width: 100%; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--neon); color: #fff; border-radius: 10px; box-sizing: border-box; }
    </style>
</head>
<body>
    <button class="logout-btn" onclick="Concordia.logout()">DISCONNECT</button>
    
    <div id="overlay">
        <div class="museum-header">
            <h1 id="mNameDisplay">LOADING...</h1>
            <p id="slotIdDisplay" style="opacity: 0.4; letter-spacing: 3px;"></p>
        </div>
        <div class="object-tray" id="tray"></div>
    </div>

    <div id="editBox">
        <h3 style="font-weight:100; color:#cbefff; margin-top:0; letter-spacing: 3px;">CURATE</h3>
        <input type="text" id="objName" placeholder="Artifact Name">
        <input type="text" id="objFound" placeholder="Origin/Location">
        <input type="file" id="fileInp" style="margin:15px 0; font-size: 11px; border:none; background:transparent;" onchange="handleFileProcessing(this)">
        <button onclick="saveObject()">STORE IN VAULT</button>
        <button onclick="document.getElementById('editBox').style.display='none'" style="background:transparent; color:#fff; font-size: 10px;">CANCEL</button>
    </div>

    <a-scene embedded style="height: 100vh; width: 100vw; z-index: -1;">
        <a-sky color="#000" opacity="0"></a-sky>
    </a-scene>

    <script src="spine.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const slot = params.get('slot');
        const isAdmin = params.get('edit') === 'true';
        let museumData = Concordia.getMuseum(slot);
        let currentFileBase64 = "";

        function handleFileProcessing(input) {
            const reader = new FileReader();
            reader.onload = (e) => { currentFileBase64 = e.target.result; };
            reader.readAsDataURL(input.files[0]);
        }

        function render() {
            document.getElementById('mNameDisplay').innerText = museumData.name.toUpperCase();
            document.getElementById('slotIdDisplay').innerText = "SYSTEM SLOT: " + slot;
            const tray = document.getElementById('tray');
            tray.innerHTML = "";

            museumData.objects.forEach((obj, index) => {
                const isImage = obj.data && obj.data.startsWith("data:image");
                const card = document.createElement('div');
                card.className = "obj-card";
                card.innerHTML = `
                    <div class="preview-area">
                        ${isImage ? `<img src="${obj.data}" class="preview-img">` : `<span style="font-size:3em; opacity:0.3">◈</span>`}
                    </div>
                    <div class="info-card">
                        <p><b>NAME:</b> ${obj.name}</p>
                        <p><b>ORIGIN:</b> ${obj.found}</p>
                        <p style="font-size:0.6em; color:var(--neon); margin-top:10px">${obj.type.toUpperCase()}</p>
                    </div>
                    <button class="dl-btn" onclick="downloadFile(${index})">DOWNLOAD</button>
                `;
                tray.appendChild(card);
            });

            if(isAdmin && museumData.objects.length < 7) {
                const add = document.createElement('div');
                add.className = "obj-card";
                add.style.justifyContent = "center";
                add.style.alignItems = "center";
                add.style.border = "1px dashed #cbefff";
                add.style.cursor = "pointer";
                add.innerHTML = "<h1 style='margin:0'>+</h1><p style='font-size:10px; letter-spacing:2px'>ADD ARTIFACT</p>";
                add.onclick = () => document.getElementById('editBox').style.display = 'block';
                tray.appendChild(add);
            }
        }

        function downloadFile(index) {
            const obj = museumData.objects[index];
            const link = document.createElement('a');
            link.href = obj.data;
            link.download = `${obj.name}.${obj.type}`;
            link.click();
        }

        function saveObject() {
            const file = document.getElementById('fileInp').files[0];
            if(!file) return alert("Upload artifact first");
            const newObj = {
                name: document.getElementById('objName').value || "Unnamed",
                found: document.getElementById('objFound').value || "Unknown",
                data: currentFileBase64,
                type: file.name.split('.').pop()
            };
            museumData.objects.push(newObj);
            Concordia.sync(slot, museumData);
            location.reload();
        }
        render();
    </script>
</body>
</html>
