<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="Screenshot 2025-11-07 203000.png">
    <title>Sodium Glas - System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #000000; 
            --cell: rgba(255, 255, 255, 0.15); /* Glass base */
            --neon: #cbefff; 
            --neon-soft: rgba(209, 210, 255, 0.788); 
        }
        
        body { 
            margin: 0; height: 100vh; 
            background: radial-gradient(circle at top, #00043e, var(--bg)); 
            background-size: 200% 200%; 
            animation: slowRotate 15s ease-in-out infinite;
            display: flex; justify-content: center; align-items: center; 
            color: var(--neon); overflow: hidden; font-family: 'Candara Light', sans-serif; 
        }

        @keyframes slowRotate { 0%, 100% { background-position: 50% 0%; } 50% { background-position: 50% 100%; } }

        /* Floating Header Styling */
        .header { position: fixed; top: 30px; left: 30px; z-index: 10; letter-spacing: 5px; }
        
        .logout-btn { 
            position: fixed; top: 30px; right: 30px; z-index: 100;
            background: rgba(203, 239, 255, 0.05); border: 1px solid var(--neon); color: var(--neon);
            padding: 8px 25px; border-radius: 20px; cursor: pointer; font-family: 'Candara Light';
            backdrop-filter: blur(10px); transition: 0.3s; letter-spacing: 2px;
        }
        .logout-btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }

        /* 3D Orientation & Planet Effect */
        .planet-wrapper { perspective: 1200px; }
        
        .grid { 
            display: grid; grid-template-columns: repeat(20, 30px); grid-template-rows: repeat(20, 30px); 
            gap: 7px; 
            transform: scale(var(--zoom, 1)) rotateX(70deg); 
            transform-style: preserve-3d; transition: transform 0.5s ease; 
        }

        /* Liquid Glass Cell Styling */
        .cell { 
            background: var(--cell); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            border-radius: 6px; 
            height: 30px; 
            cursor: pointer; 
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s, background 0.3s;
            
            /* Hidden state for animation */
            opacity: 0;
            transform: translateZ(-100px) scale(0);
        }

        /* The Pop Effect */
        .cell.visible {
            opacity: 0.3;
            transform: translateZ(0) scale(1);
        }

        .cell:hover { 
            background: var(--neon); 
            opacity: 1 !important; 
            transform: translateZ(25px) scale(1.1) !important; 
            box-shadow: 0 0 25px var(--neon), inset 0 0 10px white;
            backdrop-filter: blur(10px);
        }

        /* Owned Plot - Enhanced Liquid Look */
        .cell.owned { 
            background: linear-gradient(135deg, rgba(203, 239, 255, 0.5), rgba(203, 239, 255, 0.1));
            border: 1px solid var(--neon);
            opacity: 0.7; 
            box-shadow: 0 0 15px rgba(203, 239, 255, 0.3);
        }

        /* Modal Styling */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { 
            background: rgba(6, 22, 46, 0.7); backdrop-filter: blur(30px);
            border: 1px solid var(--neon); padding: 40px; border-radius: 30px; 
            text-align: center; width: 320px; box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        button.action { background: var(--neon); color: #000; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; margin: 5px 0; font-family: 'Candara Light'; transition: 0.2s; }
        button.action:hover { transform: scale(1.05); }
        .secondary { background: transparent; color: var(--neon); border: 1px solid var(--neon); padding: 10px; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 5px; font-family: 'Candara Light'; }
    </style>
</head>
<body>

    <button class="logout-btn" onclick="logout()">DISCONNECT</button>

    <div class="header">
        <h1 style="font-weight:100; margin:0;">SODIUM <span style="font-weight:900">GLAS</span></h1>
        <p id="userInfo" style="font-size: 0.7em; opacity: 0.5; margin-top: 5px;"></p>
    </div>

    <div class="planet-wrapper">
        <div class="grid" id="grid"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="slotTitle" style="font-weight: 100; letter-spacing: 3px;">SLOT</h2>
            <p id="slotStatus" style="opacity:0.6; font-size: 0.8em; margin-bottom: 20px;"></p>
            <button id="mainBtn" class="action" onclick="handleAction()"></button>
            <button class="secondary" onclick="enterMuseum()">Enter Museum</button>
            <button class="secondary" style="border:none; font-size: 10px;" onclick="closeModal()">CANCEL</button>
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient('https://umyynnesolilokzetade.supabase.co', 'sb_publishable_7Ry0VfCXyP_gumhjyLTdQg_6UKuCLSy');
        const user = localStorage.getItem('sodium_user');
        const uid = localStorage.getItem('sodium_uid');

        if (!user) window.location.href = 'login.html';
        document.getElementById('userInfo').innerText = `Hello, ${user} | ID: ${uid}`;

        const grid = document.getElementById('grid');
        let slotsData = {};
        let activeSlot = "";

        // Wheel Zoom Control
        let zoomLevel = 1;
        window.onwheel = (e) => {
            zoomLevel += e.deltaY * -0.0005;
            zoomLevel = Math.min(Math.max(0.5, zoomLevel), 2.5);
            grid.style.setProperty('--zoom', zoomLevel);
        };

        async function init() {
            const { data } = await _supabase.from('museums').select('slot_id, owner_uid');
            if(data) data.forEach(s => slotsData[s.slot_id] = s.owner_uid);
            
            for (let i = 0; i < 400; i++) {
                const cell = document.createElement('div');
                const rowIdx = Math.floor(i / 20);
                const colIdx = i % 20;
                
                const row = String.fromCharCode(65 + rowIdx);
                const col = colIdx + 1;
                const coord = `${row}-${col}`;
                
                // Assign classes based on ownership
                cell.className = 'cell' + (slotsData[coord] ? ' owned' : '');
                cell.onclick = () => openModal(coord);
                
                // Diagonal Pop Animation Logic
                // We add a delay based on (row index + column index)
                const staggerDelay = (rowIdx + colIdx) * 0.025;
                cell.style.transitionDelay = `${staggerDelay}s`;
                
                grid.appendChild(cell);

                // Start the animation pop in the next animation frame
                requestAnimationFrame(() => {
                    cell.classList.add('visible');
                });
            }
        }

        function openModal(coord) {
            const owner = slotsData[coord];
            activeSlot = coord;
            document.getElementById('slotTitle').innerText = "Slot " + coord;
            const btn = document.getElementById('mainBtn');
            const status = document.getElementById('slotStatus');

            if(owner === uid) {
                status.innerText = "Status: OWNED BY YOU";
                btn.innerText = "Edit Museum";
                btn.style.display = "block";
            } else if(owner) {
                status.innerText = "Status: RESERVED BY " + owner;
                btn.style.display = "none";
            } else {
                status.innerText = "Status: AVAILABLE";
                btn.innerText = "Rent Plot";
                btn.style.display = "block";
            }
            document.getElementById('modal').style.display = 'flex';
        }

        function handleAction() {
            const btnText = document.getElementById('mainBtn').innerText;
            if (btnText === "Rent Plot") {
                const msg = `Requesting Slot ${activeSlot}. User ID: ${uid}`;
                window.location.href = `https://wa.me/917979725061?text=${encodeURIComponent(msg)}`;
            } else { 
                window.location.href = `museum.html?slot=${activeSlot}&edit=true`; 
            }
        }

        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function enterMuseum() { window.location.href = `museum.html?slot=${activeSlot}`; }
        
        init();
    </script>
</body>
</html>
