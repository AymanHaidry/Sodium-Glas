<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sodium Glas - System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #000000; --cell: #ffffff; --neon: #cbefff; }
        body { 
            margin: 0; height: 100vh; background: radial-gradient(circle at top, #00043e, #000); 
            display: flex; justify-content: center; align-items: center; 
            color: var(--neon); overflow: hidden; font-family: 'Candara Light', sans-serif; 
        }

        .system-bar {
            position: fixed; top: 0; left: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); z-index: 1000; box-sizing: border-box;
            border-bottom: 1px solid rgba(203,239,255,0.1);
        }
        .logo { letter-spacing: 8px; margin: 0; font-weight: 100; font-size: 1.2em; }
        .logo b { font-weight: 900; }
        
        .logout-btn { 
            background: transparent; border: 1px solid var(--neon); color: var(--neon);
            padding: 6px 20px; border-radius: 20px; cursor: pointer; font-family: 'Candara Light';
            transition: 0.3s; font-size: 0.8em; letter-spacing: 1px;
        }
        .logout-btn:hover { background: var(--neon); color: #000; }

        .grid { 
            display: grid; grid-template-columns: repeat(20, 30px); gap: 10px; 
            transform: scale(var(--zoom, 1)) rotateX(60deg); transform-style: preserve-3d; transition: 0.5s; 
        }
        .cell { background: var(--cell); border-radius: 34px; height: 30px; cursor: pointer; transition: 0.5s; opacity: 0.2; }
        .cell:hover { background: var(--neon); opacity: 1; transform: translateZ(20px); box-shadow: 0 0 25px var(--neon); }
        .owned { background: var(--neon); opacity: 0.6; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { 
            background: rgba(6, 22, 46, 0.8); backdrop-filter: blur(30px);
            border: 1px solid var(--neon); padding: 40px; border-radius: 30px; text-align: center; width: 320px;
        }
        button.action { background: var(--neon); color: #000; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; margin: 5px 0; }
        .secondary { background: transparent; color: var(--neon); border: 1px solid rgba(203,239,255,0.3); padding: 10px; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 5px;}
    </style>
</head>
<body>
    <div class="system-bar">
        <h1 class="logo">SODIUM <b>GLAS</b></h1>
        <div style="text-align: right">
            <div id="userInfo" style="font-size: 0.7em; opacity: 0.6; margin-bottom: 5px;"></div>
            <button class="logout-btn" onclick="logout()">DISCONNECT</button>
        </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="slotTitle" style="font-weight: 100; letter-spacing: 3px;">SLOT</h2>
            <p id="slotStatus" style="opacity:0.6; font-size: 0.8em; margin-bottom: 20px;"></p>
            <button id="mainBtn" class="action" onclick="handleAction()"></button>
            <button class="secondary" onclick="enterMuseum()">ENTER MUSEUM</button>
            <button class="secondary" style="border:none; font-size: 10px;" onclick="closeModal()">CANCEL</button>
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient('https://umyynnesolilokzetade.supabase.co', 'sb_publishable_7Ry0VfCXyP_gumhjyLTdQg_6UKuCLSy');
        const user = localStorage.getItem('sodium_user');
        const uid = localStorage.getItem('sodium_uid');

        if (!user) window.location.href = 'login.html';
        document.getElementById('userInfo').innerText = `${user} | ${uid}`;

        const grid = document.getElementById('grid');
        let slotsData = {};

        async function init() {
            const { data } = await _supabase.from('museums').select('slot_id, owner_uid');
            if(data) data.forEach(s => slotsData[s.slot_id] = s.owner_uid);
            
            for (let i = 0; i < 400; i++) {
                const cell = document.createElement('div');
                const row = String.fromCharCode(65 + Math.floor(i / 20));
                const col = (i % 20) + 1;
                const coord = `${row}-${col}`;
                cell.className = 'cell' + (slotsData[coord] ? ' owned' : '');
                cell.onclick = () => openModal(coord);
                grid.appendChild(cell);
            }
        }

        function openModal(coord) {
            const owner = slotsData[coord];
            document.getElementById('slotTitle').innerText = "Slot " + coord;
            const btn = document.getElementById('mainBtn');
            const status = document.getElementById('slotStatus');
            activeSlot = coord;

            if(owner === uid) {
                status.innerText = "OWNED BY YOU";
                btn.innerText = "Edit Museum";
            } else if(owner) {
                status.innerText = "RESERVED BY: " + owner;
                btn.style.display = "none";
            } else {
                status.innerText = "AVAILABLE";
                btn.innerText = "Rent Plot";
                btn.style.display = "block";
            }
            document.getElementById('modal').style.display = 'flex';
        }

        function handleAction() {
            if (document.getElementById('mainBtn').innerText === "Rent Plot") {
                window.location.href = `https://wa.me/917979725061?text=Requesting%20Slot%20${activeSlot}`;
            } else { window.location.href = `museum.html?slot=${activeSlot}&edit=true`; }
        }

        function logout() { localStorage.clear(); window.location.href = 'login.html'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function enterMuseum() { window.location.href = `museum.html?slot=${activeSlot}`; }
        init();
    </script>
</body>
</html>
